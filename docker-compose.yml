services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintechcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-fintechcrm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Só na própria máquina: o backend fala com o banco pela rede interna do
    # docker (db:5432). Para inspecionar de fora, use um túnel SSH
    # (ssh -L 5432:127.0.0.1:5432 usuario@vps).
    ports:
      - "${DB_BIND:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fintechcrm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./apps/backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fintechcrm:change-me@db:5432/fintechcrm}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Atrás de proxy reverso (VPS), aponte BACKEND_BIND para a porta que o proxy
    # chama, ex. 127.0.0.1:18001. O padrão nunca publica para a internet.
    ports:
      - "${BACKEND_BIND:-127.0.0.1:8000}:8000"
    volumes:
      - media-data:/app/media
    networks:
      - default
      # Rede compartilhada com o TopFamaRenegocie (outra pasta em /opt): o
      # remarketing chama http://renegocie-api:8000 sem sair da VPS. Criar uma
      # vez na VPS com: docker network create topfama-interno
      - topfama-interno

  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND:-127.0.0.1:5173}:80"

networks:
  topfama-interno:
    external: true

volumes:
  postgres-data:
  media-data:
  redis-data:
