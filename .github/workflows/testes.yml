name: Testes

# Roda em todo PR e em todo push na main: scripts de teste do backend
# (inclui a caracterização do fluxo de envio), regras de import entre camadas
# (import-linter), build do frontend, os testes do seletor e o e2e. O e2e roda só os
# cenários que os arquivos alterados podem quebrar (e2e/selecionar-telas.mjs) mais a
# fumaça; a suíte inteira roda quando a mudança é ampla, toda segunda-feira e sob demanda.
# Mudança só em .md não roda: documentação vai direto para a main sem CI
# (AGENTS.md → Merge na main), e um push desses cancelaria a rodada do código
# que acabou de entrar (ver concurrency abaixo).
on:
  pull_request:
    paths-ignore: ["**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      completa:
        description: "Rodar a suíte e2e inteira"
        type: boolean
        default: true

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (scripts de teste)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: t
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Instalar dependências
        working-directory: apps/backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: Rodar os scripts
        working-directory: apps/backend
        run: ./tests/rodar_todos.sh

  arquitetura:
    name: Arquitetura (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Conferir as regras de import (apps/backend/.importlinter)
        working-directory: apps/backend
        run: |
          pip install -q import-linter==2.15
          lint-imports

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:frontend

  seletor:
    name: Seletor do e2e (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: node --test e2e/selecionar-telas.test.mjs

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # Escolhe os cenários afetados pelos arquivos alterados (e2e/selecionar-telas.mjs):
      # tags das funcionalidades tocadas + fumaça; "todos" quando a mudança é ampla.
      - name: Escolher os cenários
        id: telas
        env:
          EVENTO: ${{ github.event_name }}
          COMPLETA: ${{ inputs.completa }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENTO" = "schedule" ] || [ "$COMPLETA" = "true" ]; then
            echo '{"modo":"todos","grep":"","motivos":["execução completa (agendada ou manual)"]}' > selecao.json
          else
            if [ "$EVENTO" = "pull_request" ]; then
              git diff --name-only "origin/$BASE...HEAD" > alterados.txt
            elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              git diff --name-only "$BEFORE...HEAD" > alterados.txt
            else
              git diff --name-only "HEAD~1...HEAD" > alterados.txt
            fi
            echo "Arquivos alterados:"; cat alterados.txt
            node e2e/selecionar-telas.mjs alterados.txt > selecao.json
          fi
          echo "Seleção:"; jq . selecao.json
          echo "modo=$(jq -r .modo selecao.json)" >> "$GITHUB_OUTPUT"
          echo "grep=$(jq -r .grep selecao.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.telas.outputs.modo != 'nenhum'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Instalar dependências
        if: steps.telas.outputs.modo != 'nenhum'
        run: |
          # índice do apt da imagem pode estar velho (pacote some do mirror e dá 404)
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q redis-tools >/dev/null
          python -m venv apps/backend/.venv
          apps/backend/.venv/bin/pip install -q -r apps/backend/requirements.txt
          cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: Subir o ambiente de teste
        if: steps.telas.outputs.modo != 'nenhum'
        working-directory: e2e
        run: ./ambiente/subir.sh
      - name: Rodar a suíte
        if: steps.telas.outputs.modo != 'nenhum'
        working-directory: e2e
        env:
          MODO: ${{ steps.telas.outputs.modo }}
          GREP: ${{ steps.telas.outputs.grep }}
        run: |
          if [ "$MODO" = "todos" ]; then
            npx playwright test --reporter=line
          else
            npx playwright test --reporter=line --grep "$GREP"
          fi
      - name: Nenhum cenário afetado
        if: steps.telas.outputs.modo == 'nenhum'
        run: echo "Nenhum arquivo alterado é exercitado pelo e2e; suíte pulada."
      - name: Logs do ambiente
        if: failure()
        run: tail -100 e2e/.ambiente-logs/backend.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
