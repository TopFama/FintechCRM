name: Testes

# Roda em todo PR e em todo push na main: scripts de teste do backend
# (inclui a caracterização do fluxo de envio), build do frontend e a suíte e2e.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (scripts de teste)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: t
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Instalar dependências
        working-directory: apps/backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: Rodar os scripts
        working-directory: apps/backend
        run: ./tests/rodar_todos.sh

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:frontend

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependências
        run: |
          sudo apt-get install -y -q redis-tools >/dev/null
          python -m venv apps/backend/.venv
          apps/backend/.venv/bin/pip install -q -r apps/backend/requirements.txt
          cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: Subir o ambiente de teste
        working-directory: e2e
        run: ./ambiente/subir.sh
      - name: Rodar a suíte
        working-directory: e2e
        run: npx playwright test --reporter=line
      - name: Logs do ambiente
        if: failure()
        run: tail -100 e2e/.ambiente-logs/backend.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
