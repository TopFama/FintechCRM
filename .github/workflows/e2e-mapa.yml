name: Mapa de cenários do e2e

# Confere o que o seletor (e2e/selecionar-telas.mjs) promete: cada spec e cada tag
# roda sozinho, numa máquina própria e sem nenhum outro cenário antes. Se uma falha
# aqui e passa na suíte inteira, o cenário depende de outro que o seletor não traz
# (preparar o estado em e2e/tests/preparo.ts, ou marcar o describe com as tags
# certas). Roda quando o seletor ou os cenários mudam, e manualmente ("Run workflow").
on:
  pull_request:
    paths:
      - "e2e/selecionar-telas.mjs"
      - "e2e/ambiente/**"
      - "e2e/tests/**"
      - ".github/workflows/e2e-mapa.yml"
  workflow_dispatch: {}

concurrency:
  group: e2e-mapa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telas:
    name: Listar specs e tags
    runs-on: ubuntu-latest
    outputs:
      itens: ${{ steps.lista.outputs.itens }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - id: lista
        run: |
          specs=$(node e2e/selecionar-telas.mjs --listar-specs)
          tags=$(node e2e/selecionar-telas.mjs --listar-tags)
          itens=$( { for s in $specs; do echo "spec:$s"; done; for t in $tags; do echo "tag:$t"; done; } | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "itens=$itens" >> "$GITHUB_OUTPUT"

  isolado:
    name: ${{ matrix.item }}
    needs: telas
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.telas.outputs.itens) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Instalar dependências
        run: |
          # índice do apt da imagem pode estar velho (pacote some do mirror e dá 404)
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q redis-tools >/dev/null
          python -m venv apps/backend/.venv
          apps/backend/.venv/bin/pip install -q -r apps/backend/requirements.txt
          cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: Subir o ambiente de teste
        working-directory: e2e
        run: ./ambiente/subir.sh
      - name: Rodar sozinho
        working-directory: e2e
        env:
          ITEM: ${{ matrix.item }}
        run: |
          case "$ITEM" in
            spec:*) npx playwright test --reporter=line "tests/${ITEM#spec:}.spec.ts" ;;
            tag:*) npx playwright test --reporter=line --grep "@${ITEM#tag:}\\b" ;;
          esac
      - name: Logs do ambiente
        if: failure()
        run: tail -100 e2e/.ambiente-logs/backend.log || true
