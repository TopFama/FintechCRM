name: Auto-merge de PRs

on:
  workflow_run:
    workflows: ["Testes"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  auto-merge:
    name: Merge de PR aprovado no CI
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Identificar e mesclar PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Testes concluídos com sucesso para a branch: $HEAD_BRANCH (SHA: $HEAD_SHA)"

          # Localiza PR aberto correspondente à branch
          pr_json=$(gh pr list --head "$HEAD_BRANCH" --base main --state open --json number,mergeable,mergeStateStatus,title --jq '.[0]')
          if [ -z "$pr_json" ] || [ "$pr_json" = "null" ]; then
            echo "Nenhum PR aberto encontrado para a branch $HEAD_BRANCH."
            exit 0
          fi

          pr_num=$(echo "$pr_json" | jq -r '.number')
          mergeable=$(echo "$pr_json" | jq -r '.mergeable')
          merge_state=$(echo "$pr_json" | jq -r '.mergeStateStatus')
          pr_title=$(echo "$pr_json" | jq -r '.title')

          echo "PR encontrado: #$pr_num - $pr_title"
          echo "Status: mergeable=$mergeable, mergeStateStatus=$merge_state"

          if [ "$mergeable" != "MERGEABLE" ]; then
            echo "::warning::PR #$pr_num não está pronto para merge automático (mergeable=$mergeable, state=$merge_state)."
            exit 0
          fi

          echo "Executando merge do PR #$pr_num..."
          gh pr merge "$pr_num" \
            --merge \
            --match-head-commit "$HEAD_SHA" \
            --subject "Merge pull request #$pr_num from ${{ github.repository_owner }}/$HEAD_BRANCH" \
            --body "Merge automático via GitHub Actions após aprovação completa na suíte de Testes."

          echo "PR #$pr_num mesclado com sucesso na main."

          # Dispara a suíte de Testes na main para iniciar o ciclo de deploy automático
          echo "Disparando suíte de Testes na branch main..."
          gh workflow run testes.yml --ref main || echo "::warning::Não foi possível disparar testes.yml automaticamente"
