# Dentro do location da API (link em /etc/nginx/snippets/): repassa o upgrade
# do WebSocket do Dashboard (/api/dashboard/ws). O backend manda sinal a cada
# 25 s, abaixo do proxy_read_timeout. Ver README → Deploy.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $fintechcrm_connection;
proxy_read_timeout 75s;
